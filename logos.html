<!doctype html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Logos</title>
		<link rel="stylesheet" type="text/css" href="logos.css">
		<script src="logos.js"></script>
	</head>
	<body>
		<div id="message">
			<span id="status"></span>
			<span id="timer">0:00</span>
		</div>
		<table id="board"></table>
		<table id="hclues"></table>
		<div id="controls">
			<input type="button" onClick="puzzle.newGame()" value="New Game">
			<input type="button" onClick="puzzle.toggleClues()" value="Toggle Clues">
			<input id="options-button" type="button"
			       onClick="puzzle.toggleOptions()" value="Options"
			       aria-expanded="false" aria-controls="options-menu">
			<div id="options-menu" hidden>
				<div class="options-panel">
					<fieldset>
						<legend>Cursor</legend>
						<label><input type="radio" name="cursor" value="gear"
						              onChange="puzzle.setCursor(this.value)">
						       Antikythera gear</label>
						<label><input type="radio" name="cursor" value="stylus"
						              onChange="puzzle.setCursor(this.value)">
						       Bronze stylus</label>
						<label><input type="radio" name="cursor" value="native"
						              onChange="puzzle.setCursor(this.value)">
						       System default</label>
					</fieldset>
					<fieldset>
						<legend>Display</legend>
						<label><input id="show-milestones" type="checkbox" checked
						              onChange="puzzle.setMilestones(this.checked)">
						       Milestone messages</label>
						<label><input id="show-timer" type="checkbox" checked
						              onChange="puzzle.setTimerVisible(this.checked)">
						       Show timer</label>
					</fieldset>
					<input class="options-done" type="button"
					       onClick="puzzle.toggleOptions()" value="Close options">
				</div>
			</div>
			<div id="logo" aria-label="Logos">
				<span class="logo-greek" aria-hidden="true">ΛΟΓΟΣ</span>
				<span class="logo-name">LOGOS</span>
				<span class="logo-tagline">A puzzle of pure reason</span>
			</div>
		</div>
		<table id="vclues"></table>

		<script>
		var puzzle = new Puzzle(
				document.getElementById("board"),
				document.getElementById("hclues"),
				document.getElementById("vclues"),
				document.getElementById("status"),
				document.getElementById("timer"),
				undefined,
				document.getElementById("options-menu"),
				document.getElementById("options-button"));
		</script>
	</body>
</html>
