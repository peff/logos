<!doctype html>
<meta charset="utf-8">
<title>Logos multiplayer browser tests</title>
<style>iframe { width: 390px; height: 844px; }</style>
<pre id="result">Running (serve this page over HTTP)…</pre>
<script>
(async function() {
	const result = document.querySelector("#result");
	const frames = [];
	const room = "browser-test-" + crypto.randomUUID();
	function assert(condition, message) {
		if (!condition) throw new Error(message);
	}
	async function waitFor(test, message) {
		const deadline = Date.now() + 40000;
		while (!test()) {
			if (Date.now() > deadline) throw new Error("Timed out: " + message);
			await new Promise(resolve => setTimeout(resolve, 100));
		}
	}
	async function open(role, name) {
		const frame = document.createElement("iframe");
		frame.src = "../index.html?" + new URLSearchParams({
			"local-role": role, "local-name": name, "local-test": room,
		});
		frames.push(frame);
		const loaded = new Promise(resolve => frame.onload = resolve);
		document.body.append(frame);
		await loaded;
		await waitFor(() => frame.contentDocument.querySelector("#local-test-controls"), "test controls");
		return frame.contentWindow;
	}
	try {
		const host = await open("host", "Helen");
		const inviteStatus = host.document.querySelector('#friends-roster-status');
		await waitFor(() => inviteStatus.textContent == "Invite friends" &&
			host.document.querySelector('#friends-menu').hidden, "host invitation prompt");
		inviteStatus.click();
		assert(!host.document.querySelector('#friends-menu').hidden &&
			host.document.querySelector('#friends-roster-button').getAttribute('aria-expanded') == "true",
			"clicking Invite friends did not open the friends dialog");
		host.document.querySelector('#friends-menu .modal-close').click();
		const alice = await open("guest", "Alice");
		const bob = await open("guest", "Bob");
		const players = app => app.document.querySelector("#friends-roster-players");
		function checkStarter(name) {
			for (const app of [host, alice, bob]) {
				const icons = players(app).querySelectorAll('.friends-roster-action');
				assert(icons.length == 1 && icons[0].dataset.action == "new-game" &&
					icons[0].querySelector("svg") &&
					icons[0].closest("li").querySelector('.friends-roster-name').textContent == name,
					"new game icon missing or attributed to the wrong player");
			}
		}
		await waitFor(() => [host, alice, bob].every(app => players(app).children.length == 3),
			"three players connected through automatic signaling");
		for (const app of [host, alice, bob]) {
			assert(!app.document.querySelector("#friends-roster").hidden, "roster is hidden");
			assert(Array.from(players(app).querySelectorAll(".friends-roster-name"))
				.map(name => name.textContent).sort().join() == "Alice,Bob,Helen", "names differ");
			const self = players(app).querySelectorAll('[data-self="true"]');
			assert(self.length == 1 && self[0].querySelector(".friends-roster-name").textContent ==
				app.puzzle.actionController.playerName, "own player is not identified");
		}
		for (const app of [host, alice, bob])
			assert(app.puzzle.seed === undefined && app.puzzle.timer.hidden &&
			       !app.document.querySelector("#new-game-button").disabled,
			       "connecting did not leave an idle lobby with New Game available");
		alice.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app =>
			app.puzzle.actionController.gameId == 1 && !app.puzzle.gameOver),
			"guest starts the shared game");
		checkStarter("Alice");
		assert(host.puzzle.seed == alice.puzzle.seed && host.puzzle.seed == bob.puzzle.seed,
			"the shared seeds differ");
		bob.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 2),
			"another guest replaces the game");
		checkStarter("Bob");
		host.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 3),
			"host replaces the game");
		checkStarter("Helen");
		host.puzzle.actionController.start(0x12345678);
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 4),
			"deterministic history test game");
		const slot = alice.puzzle.rows[0].slots.find(slot => !slot.single);
		const value = slot.possible.findIndex((possible, value) => possible && value != slot.value);
		alice.puzzle.requestTileAction(slot, value, "remove");
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelectorAll('[data-action="remove"]').length == 1),
			"guest discard appears in every roster");
		for (const app of [host, alice, bob]) {
			const icon = players(app).querySelector('[data-action="remove"]');
			assert(icon.closest("li").querySelector(".friends-roster-name").textContent == "Alice",
				"discard attributed to the wrong player");
			assert(icon.textContent == slot.symbols[value] && icon.title.includes("column"),
				"discard is missing its tile or column tooltip");
		}
		const nextSlot = slot.row.slots.find(other => other != slot &&
			!other.single && other.value != value && other.possible[value]);
		alice.puzzle.requestTileAction(nextSlot, value, "remove");
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('.friends-roster-count')?.textContent == "2"),
			"consecutive discards share a count badge");
		for (const app of [host, alice, bob]) {
			const icons = players(app).querySelectorAll('[data-action="remove"]');
			assert(icons.length == 1 && icons[0].title.includes("columns ") &&
				icons[0].title.endsWith([slot, nextSlot].map(s => s.row.slots.indexOf(s) + 1).join(", ")),
				"grouped discard lost its columns");
		}
		const heldEvent = players(alice).querySelector('.friends-roster-tile-event');
		const marked = () => alice.document.querySelectorAll('#board .history-highlight');
		/* Synthetic pointer events have no browser-owned pointer to capture. */
		heldEvent.setPointerCapture = () => {};
		const press = target => target.dispatchEvent(new alice.PointerEvent('pointerdown', {
			bubbles: true, button: 0, pointerId: 42, isPrimary: true,
		}));
		press(heldEvent.querySelector('.friends-roster-count'));
		assert(marked().length == 2 && slot.elem.classList.contains('history-highlight') &&
			nextSlot.elem.classList.contains('history-highlight'), "badge hold did not highlight both slots");
		assert(!host.document.querySelector('.history-highlight'), "history highlighting was shared");
		alice.document.body.dispatchEvent(new alice.PointerEvent('pointerup', { bubbles: true, pointerId: 42 }));
		assert(marked().length == 0, "release outside the icon retained highlights");
		press(heldEvent);
		heldEvent.dispatchEvent(new alice.PointerEvent('pointercancel', { bubbles: true, pointerId: 42 }));
		assert(marked().length == 0, "pointer cancellation retained highlights");
		press(heldEvent);
		bob.puzzle.togglePause();
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('[data-action="pause"] svg')), "pause icons appear");
		assert(marked().length == 0, "roster refresh retained held highlights");
		press(players(alice).querySelector('[data-action="pause"]'));
		assert(marked().length == 0, "a meta entry highlighted tiles");
		host.puzzle.togglePause();
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('[data-action="resume"] svg')), "resume columns appear");
		const placedSlot = host.puzzle.rows[1].slots.find(slot => !slot.single);
		host.puzzle.requestTileAction(placedSlot, placedSlot.value, "place");
		await waitFor(() => players(alice).querySelector('[data-action="place"]'), "placement history entry");
		const placementEvent = players(alice).querySelector('[data-action="place"]').parentElement;
		placementEvent.setPointerCapture = () => {};
		press(placementEvent);
		assert(marked().length == 1 && marked()[0] ==
			alice.puzzle.rows[1].slots[placedSlot.row.slots.indexOf(placedSlot)].elem,
			"placement hold did not highlight its slot");
		alice.dispatchEvent(new alice.Event('blur'));
		assert(marked().length == 0, "window blur retained highlights");
		alice.puzzle.hintAcknowledged = true;
		const buttonTop = alice.document.querySelector('#new-game-button').getBoundingClientRect().top;
		const rosterBox = alice.document.querySelector('#friends-roster').getBoundingClientRect();
		assert(rosterBox.bottom <= buttonTop, "roster is not above the control buttons");
		for (let stage = 1; stage <= 3; stage++) {
			alice.document.querySelector('#explain-button').click();
			await waitFor(() => [host, alice, bob].every(app =>
				app.puzzle.actionController.recentActions.get(alice.puzzle.actionController.playerId)
					.filter(action => action.type == "hint").length == stage),
				"hint press recorded on all peers");
			assert((alice.getComputedStyle(alice.document.querySelector('#friends-roster')).display == "none") ==
				(stage >= 2), "roster visibility did not follow the local proof controls");
			assert(Math.abs(alice.document.querySelector('#new-game-button').getBoundingClientRect().top -
				buttonTop) < 1, "switching from roster to proof moved the buttons at stage " + stage +
				": " + buttonTop + " -> " + alice.document.querySelector('#new-game-button').getBoundingClientRect().top);
			if (stage >= 2) {
				const proofBox = alice.document.querySelector('#proof-controls').getBoundingClientRect();
				assert(Math.abs(proofBox.top - rosterBox.top) < 1 &&
					Math.abs(proofBox.height - rosterBox.height) < 1,
					"roster and proof controls do not share the same space");
			}
			for (const app of [host, bob])
				assert(app.getComputedStyle(app.document.querySelector('#friends-roster')).display != "none",
					"another player's hint hid the roster");
		}
		for (const app of [host, alice, bob]) {
			const icons = players(app).querySelectorAll('[data-action="hint"]');
			assert(icons.length == 1 && icons[0].textContent == "∵" &&
				icons[0].parentElement.querySelector('.friends-roster-count').textContent == "3",
				"hint presses did not share a because icon and count badge");
			assert(app.puzzle.practiceMode && app.puzzle.timerTimeout === null,
				"hint did not put everyone into zen mode");
		}
		assert(alice.puzzle.proof?.hint && !host.puzzle.proof && !bob.puzzle.proof,
			"proof viewer was not confined to the requester");
		alice.puzzle.closeProof();
		assert(Math.abs(alice.document.querySelector('#new-game-button').getBoundingClientRect().top -
			buttonTop) < 1, "closing the proof moved the buttons");
		assert(alice.getComputedStyle(alice.document.querySelector('#friends-roster')).display != "none",
			"closing the proof did not restore the roster");
		alice.document.querySelector("#friends-roster-button").click();
		assert(!alice.document.querySelector("#friends-menu").hidden, "the roster heading did not open the menu");
		alice.document.querySelector("#friends-leave").click();
		assert(alice.document.querySelector("#friends-roster").hidden, "leaving did not hide the roster");
		await waitFor(() => players(host).children.length == 2 && players(bob).children.length == 2,
			"departure propagated to the other guest");
		assert(!players(bob).textContent.includes("Alice"), "departed name remains");
		host.document.querySelector("#friends-roster-button").click();
		host.document.querySelector("#friends-leave").click();
		await waitFor(() => bob.document.querySelector("#friends-roster-status").textContent.includes("Disconnected"),
			"host departure shown to guest");
		assert(players(bob).children.length == 0, "disconnected guest retained a stale roster");
		result.textContent = "PASS: lobby, shared New Game controls, player action histories, guest and host departures";
	} catch (error) {
		result.textContent = "FAIL: " + error.stack;
	}
	console.log("ROSTER_TEST_RESULT " + result.textContent);
})();
</script>
