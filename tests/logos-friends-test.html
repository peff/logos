<!doctype html>
<meta charset="utf-8">
<title>Logos multiplayer browser tests</title>
<style>iframe { width: 390px; height: 844px; }</style>
<pre id="result">Running (serve the repository and run wrangler dev on port 8787)…</pre>
<script>
(async function() {
	const result = document.querySelector("#result");
	const frames = [];
	const room = "browser-test-" + crypto.randomUUID();
	function assert(condition, message) {
		if (!condition) throw new Error(message);
	}
	async function waitFor(test, message) {
		const deadline = Date.now() + 40000;
		while (!test()) {
			if (Date.now() > deadline) throw new Error("Timed out: " + message);
			await new Promise(resolve => setTimeout(resolve, 100));
		}
	}
	async function open(role, name) {
		const frame = document.createElement("iframe");
		frame.src = "../index.html";
		frames.push(frame);
		const loaded = new Promise(resolve => frame.onload = resolve);
		document.body.append(frame);
		await loaded;
		const app = frame.contentWindow, doc = app.document;
		/* Same-machine peers need no external STUN service. */
		const Peer = app.RTCPeerConnection;
		app.RTCPeerConnection = function() { return new Peer({ iceServers: [] }); };
		doc.querySelector('meta[name="logos-rooms-endpoint"]').content = "http://127.0.0.1:8787/api/rooms";
		doc.querySelector("#friends-player-name").value = name;
		/* Read the invitation without reloading away our local test setup. */
		app.history.replaceState(null, "", "#room=" + room);
		app.readRoomLink();
		await waitFor(() => app.puzzle.actionController?.ready, "room connection");
		assert(app.puzzle.actionController.role == role, "unexpected room role");
		if (!doc.querySelector("#friends-menu").hidden)
			doc.querySelector("#friends-menu .modal-close").click();
		return app;
	}
	try {
		const host = await open("host", "Helen");
		const inviteStatus = host.document.querySelector('#friends-roster-status');
		await waitFor(() => inviteStatus.textContent == "Invite friends" &&
			host.document.querySelector('#friends-menu').hidden, "host invitation prompt");
		inviteStatus.click();
		assert(!host.document.querySelector('#friends-menu').hidden &&
			host.document.querySelector('#friends-roster-button').getAttribute('aria-expanded') == "true",
			"clicking Invite friends did not open the friends dialog");
		host.document.querySelector('#friends-menu .modal-close').click();
		const alice = await open("guest", "Alice");
		const bob = await open("guest", "Bob");
		const players = app => app.document.querySelector("#friends-roster-players");
		function checkStarter(name) {
			for (const app of [host, alice, bob]) {
				const icons = players(app).querySelectorAll('.friends-roster-action');
				assert(icons.length == 1 && icons[0].dataset.action == "new-game" &&
					icons[0].querySelector("svg") &&
					icons[0].closest("li").querySelector('.friends-roster-name').textContent == name,
					"new game icon missing or attributed to the wrong player");
			}
		}
		await waitFor(() => [host, alice, bob].every(app => players(app).children.length == 3),
			"three players connected through automatic signaling");
		function checkRosterLayout(app) {
			const list = players(app);
			const rows = Array.from(list.children, item => item.getBoundingClientRect());
			const box = list.getBoundingClientRect();
			assert(rows.every(row => row.top >= box.top && row.bottom <= box.bottom + 1),
				"a player row is clipped");
			assert(rows.length <= 4, "too many player rows are shown");
			if (rows.length > 2)
				assert(Math.abs(rows[0].top - rows[1].top) < 1 && rows[1].left > rows[0].left &&
					rows[2].top > rows[0].top, "larger roster did not use two columns");
			else if (rows.length == 2)
				assert(rows[1].top > rows[0].top, "two players did not use one column");
		}
		for (const app of [host, alice, bob]) {
			checkRosterLayout(app);
			assert(!app.document.querySelector("#friends-roster").hidden, "roster is hidden");
			const board = app.document.querySelector("#board").getBoundingClientRect();
			const roster = app.document.querySelector("#friends-roster").getBoundingClientRect();
			assert(board.left >= 0 && board.right <= app.innerWidth &&
			       roster.left >= 0 && roster.right <= app.innerWidth && roster.top >= board.bottom,
			       "portrait lobby placed the roster beside the board or clipped the board");
			assert(Array.from(players(app).querySelectorAll(".friends-roster-name"))
				.map(name => name.textContent).sort().join() == "Alice,Bob,Helen", "names differ");
			const self = players(app).querySelectorAll('[data-self="true"]');
			assert(self.length == 1 && self[0].querySelector(".friends-roster-name").textContent ==
				app.puzzle.actionController.playerName, "own player is not identified");
		}
		for (const app of [host, alice, bob])
			assert(app.puzzle.seed === undefined && !app.puzzle.timer.hidden &&
			       app.puzzle.timerText.textContent === "—" &&
			       !app.document.querySelector("#new-game-button").disabled,
			       "connecting did not leave an idle lobby with New Game available");
		alice.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app =>
			app.puzzle.actionController.gameId == 1 && !app.puzzle.gameOver),
			"guest starts the shared game");
		checkStarter("Alice");
		assert(host.puzzle.seed == alice.puzzle.seed && host.puzzle.seed == bob.puzzle.seed,
			"the shared seeds differ");
		bob.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 2),
			"another guest replaces the game");
		checkStarter("Bob");
		host.document.querySelector("#new-game-button").click();
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 3),
			"host replaces the game");
		checkStarter("Helen");
		host.puzzle.actionController.start(0x12345678);
		await waitFor(() => [host, alice, bob].every(app => app.puzzle.actionController.gameId == 4),
			"deterministic history test game");
		const hoverCell = alice.puzzle.rows[0].slots[0].possibilityElems[0];
		const pointerOver = (app, cell, pointerType = "mouse") => cell.dispatchEvent(
			new app.PointerEvent("pointerover", { bubbles: true, pointerType }));
		pointerOver(alice, hoverCell, "touch");
		await new Promise(resolve => setTimeout(resolve, 50));
		assert(!host.document.querySelector("[data-shared-hover]"), "touch shared a hover");
		pointerOver(alice, hoverCell);
		await waitFor(() => host.document.querySelector("[data-shared-hover]") &&
			bob.document.querySelector("[data-shared-hover]"), "guest hover relayed");
		assert(!alice.document.querySelector("[data-shared-hover]"), "local hover was drawn");
		assert(host.puzzle.rows[0].slots[0].possibilityElems[0].dataset.sharedHover,
			"hover mapped to the wrong possibility");
		pointerOver(bob, bob.puzzle.rows[0].slots[0].possibilityElems[0]);
		await waitFor(() => host.puzzle.rows[0].slots[0].possibilityElems[0].style
			.getPropertyValue("--shared-hover-rings").includes("0.2rem"), "overlapping player rings");
		alice.document.querySelector("#friends-roster-button").click();
		await waitFor(() => !bob.document.querySelector("[data-shared-hover]"), "dialog clears hover");
		alice.document.querySelector("#friends-menu .modal-close").click();
		bob.dispatchEvent(new bob.Event("blur"));
		await waitFor(() => !host.document.querySelector("[data-shared-hover]"), "blur clears hover");
		const clueIndex = alice.puzzle.clues.findIndex(clue => clue.displayType == "horizontal");
		const hostClue = host.puzzle.clues[clueIndex];
		pointerOver(alice, alice.puzzle.clues[clueIndex].display.querySelector(".tile"));
		await waitFor(() => hostClue.display.dataset.sharedHover &&
			bob.puzzle.clues[clueIndex].display.dataset.sharedHover, "clue hover relayed");
		assert(!alice.puzzle.clues[clueIndex].display.dataset.sharedHover, "local clue hover drawn");
		const oldClueDisplay = hostClue.display;
		host.puzzle.moveClueToSlot(hostClue, host.puzzle.hClueSlots.at(-1));
		await waitFor(() => hostClue.display !== oldClueDisplay && hostClue.display.dataset.sharedHover,
			"highlight follows locally reordered clue");
		assert(!oldClueDisplay.dataset.sharedHover, "highlight stuck on old clue position");
		host.puzzle.applyClueAction(hostClue, false);
		assert(hostClue.display.dataset.sharedHover, "local clue dismissal lost shared highlight");
		alice.puzzle.clues[clueIndex].display.dispatchEvent(new alice.PointerEvent("pointerout", {
			bubbles: true, pointerType: "mouse", relatedTarget: alice.document.body,
		}));
		await waitFor(() => !host.document.querySelector("[data-shared-hover]"), "leaving clues clears hover");
		host.puzzle.applyClueAction(hostClue, true);
		assert(new Set(Array.from(players(host).children, entry =>
			host.getComputedStyle(entry, "::before").backgroundColor)).size == 3,
			"roster bullets lack distinct player colors");
		const slot = alice.puzzle.rows[0].slots.find(slot => !slot.single);
		const value = slot.possible.findIndex((possible, value) => possible && value != slot.value);
		alice.puzzle.requestTileAction(slot, value, "remove");
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelectorAll('[data-action="remove"]').length == 1),
			"guest discard appears in every roster");
		for (const app of [host, alice, bob]) {
			const icon = players(app).querySelector('[data-action="remove"]');
			assert(icon.closest("li").querySelector(".friends-roster-name").textContent == "Alice",
				"discard attributed to the wrong player");
			assert(icon.textContent == slot.symbols[value] && icon.title.includes("column"),
				"discard is missing its tile or column tooltip");
		}
		const nextSlot = slot.row.slots.find(other => other != slot &&
			!other.single && other.value != value && other.possible[value]);
		alice.puzzle.requestTileAction(nextSlot, value, "remove");
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('.friends-roster-count')?.textContent == "2"),
			"consecutive discards share a count badge");
		for (const app of [host, alice, bob]) {
			const icons = players(app).querySelectorAll('[data-action="remove"]');
			assert(icons.length == 1 && icons[0].title.includes("columns ") &&
				icons[0].title.endsWith([slot, nextSlot].map(s => s.row.slots.indexOf(s) + 1).join(", ")),
				"grouped discard lost its columns");
		}
		const heldEvent = players(alice).querySelector('.friends-roster-tile-event');
		const marked = () => alice.document.querySelectorAll('#board .history-highlight');
		/* Synthetic pointer events have no browser-owned pointer to capture. */
		heldEvent.setPointerCapture = () => {};
		const press = target => target.dispatchEvent(new alice.PointerEvent('pointerdown', {
			bubbles: true, button: 0, pointerId: 42, isPrimary: true,
		}));
		press(heldEvent.querySelector('.friends-roster-count'));
		assert(marked().length == 2 && slot.elem.classList.contains('history-highlight') &&
			nextSlot.elem.classList.contains('history-highlight'), "badge hold did not highlight both slots");
		assert(!host.document.querySelector('.history-highlight'), "history highlighting was shared");
		alice.document.body.dispatchEvent(new alice.PointerEvent('pointerup', { bubbles: true, pointerId: 42 }));
		assert(marked().length == 0, "release outside the icon retained highlights");
		press(heldEvent);
		heldEvent.dispatchEvent(new alice.PointerEvent('pointercancel', { bubbles: true, pointerId: 42 }));
		assert(marked().length == 0, "pointer cancellation retained highlights");
		press(heldEvent);
		bob.puzzle.togglePause();
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('[data-action="pause"] svg')), "pause icons appear");
		assert(marked().length == 0, "roster refresh retained held highlights");
		press(players(alice).querySelector('[data-action="pause"]'));
		assert(marked().length == 0, "a meta entry highlighted tiles");
		host.puzzle.togglePause();
		await waitFor(() => [host, alice, bob].every(app =>
			players(app).querySelector('[data-action="resume"] svg')), "resume columns appear");
		const placedSlot = host.puzzle.rows[1].slots.find(slot => !slot.single);
		host.puzzle.requestTileAction(placedSlot, placedSlot.value, "place");
		await waitFor(() => players(alice).querySelector('[data-action="place"]'), "placement history entry");
		const placementEvent = players(alice).querySelector('[data-action="place"]').parentElement;
		placementEvent.setPointerCapture = () => {};
		press(placementEvent);
		assert(marked().length == 1 && marked()[0] ==
			alice.puzzle.rows[1].slots[placedSlot.row.slots.indexOf(placedSlot)].elem,
			"placement hold did not highlight its slot");
		alice.dispatchEvent(new alice.Event('blur'));
		assert(marked().length == 0, "window blur retained highlights");
		alice.puzzle.showActionSelector = true;
		alice.puzzle.updateActionControls();
		alice.puzzle.hintAcknowledged = true;
		const buttonTop = alice.document.querySelector('#new-game-button').getBoundingClientRect().top;
		const rosterBox = alice.document.querySelector('#friends-roster').getBoundingClientRect();
		assert(rosterBox.bottom <= buttonTop, "roster is not above the control buttons");
		assert(rosterBox.top >= Math.max(
			alice.document.querySelector('#hclues').getBoundingClientRect().bottom,
			alice.document.querySelector('#vclues').getBoundingClientRect().bottom),
			"portrait roster is not below the clues: " + rosterBox.top + " / " +
			alice.document.querySelector('#vclues').getBoundingClientRect().bottom);
		for (let stage = 1; stage <= 3; stage++) {
			alice.document.querySelector('#explain-button').click();
			await waitFor(() => [host, alice, bob].every(app =>
				app.puzzle.actionController.recentActions.get(alice.puzzle.actionController.playerId)
					.filter(action => action.type == "hint").length == stage),
				"hint press recorded on all peers");
			assert((alice.getComputedStyle(alice.document.querySelector('#friends-roster')).display == "none") ==
				(stage >= 2), "roster visibility did not follow the local proof controls");
			assert(Math.abs(alice.document.querySelector('#new-game-button').getBoundingClientRect().top -
				buttonTop) < 1, "switching from roster to proof moved the buttons at stage " + stage +
				": " + buttonTop + " -> " + alice.document.querySelector('#new-game-button').getBoundingClientRect().top);
			if (stage >= 2) {
				const proofBox = alice.document.querySelector('#proof-controls').getBoundingClientRect();
				assert(Math.abs(proofBox.top - rosterBox.top) < 1 &&
				       Math.abs(proofBox.height - rosterBox.height) < 1,
					"roster and proof controls do not share the same space");
			}
			for (const app of [host, bob])
				assert(app.getComputedStyle(app.document.querySelector('#friends-roster')).display != "none",
					"another player's hint hid the roster");
		}
		for (const app of [host, alice, bob]) {
			const icons = players(app).querySelectorAll('[data-action="hint"]');
			assert(icons.length == 1 && icons[0].textContent == "∵" &&
				icons[0].parentElement.querySelector('.friends-roster-count').textContent == "3",
				"hint presses did not share a because icon and count badge");
			assert(app.puzzle.practiceMode && app.puzzle.timerTimeout === null,
				"hint did not put everyone into zen mode");
		}
		assert(alice.puzzle.proof?.hint && !host.puzzle.proof && !bob.puzzle.proof,
			"proof viewer was not confined to the requester");
		alice.puzzle.closeProof();
		assert(Math.abs(alice.document.querySelector('#new-game-button').getBoundingClientRect().top -
			buttonTop) < 1, "closing the proof moved the buttons");
		assert(alice.getComputedStyle(alice.document.querySelector('#friends-roster')).display != "none",
			"closing the proof did not restore the roster");
		const carol = await open("guest", "Carol");
		await waitFor(() => [host, alice, bob, carol].every(app => players(app).children.length == 4),
			"four-player roster");
		for (const app of [host, alice, bob, carol]) checkRosterLayout(app);
		const dora = await open("guest", "Dora");
		await waitFor(() => [host, alice, bob, carol, dora].every(app =>
			app.puzzle.actionController.players.length == 5), "five-player room");
		for (const app of [host, alice, bob, carol, dora]) {
			checkRosterLayout(app);
			assert(players(app).children.length == 4 && !players(app).querySelector('[data-self="true"]'),
				"five-player roster did not omit the local player first");
		}
		for (const app of [carol, dora]) {
			app.document.querySelector('#friends-roster-button').click();
			app.document.querySelector('#friends-leave').click();
		}
		await waitFor(() => [host, alice, bob].every(app => players(app).children.length == 3 &&
			players(app).querySelector('[data-self="true"]')), "own player restored after departures");
		alice.document.querySelector("#friends-roster-button").click();
		assert(!alice.document.querySelector("#friends-menu").hidden, "the roster heading did not open the menu");
		alice.document.querySelector("#friends-leave").click();
		assert(alice.document.querySelector("#friends-roster").hidden, "leaving did not hide the roster");
		await waitFor(() => players(host).children.length == 2 && players(bob).children.length == 2,
			"departure propagated to the other guest");
		assert(!players(bob).textContent.includes("Alice"), "departed name remains");
		checkRosterLayout(host);
		checkRosterLayout(bob);
		for (const [requester, seed] of [[host, "10699"], [bob, "0"]]) {
			requester.puzzle.toggleOptions();
			const input = requester.document.querySelector("#game-seed");
			const start = requester.document.querySelector("#start-game-button");
			assert(!input.disabled && !start.disabled, "shared seed controls are disabled");
			input.value = seed;
			start.click();
			await waitFor(() => [host, bob].every(app => app.puzzle.seed === parseInt(seed, 16)),
				"explicit shared seed " + seed);
			assert(requester.puzzle.options.hidden, "starting a seed did not close Options");
		}

		const randomGuest = await open("guest", "Theseus");
		const seedGuest = await open("guest", "Sappho");
		await waitFor(() => [randomGuest, seedGuest].every(app => app.puzzle.actionController?.ready),
			"guests connected for disconnected game-start checks");
		const beforeDeparture = [host, bob].map(app => ({
			seed: app.puzzle.seed,
			elapsed: app.puzzle.actionController.clockState().elapsed,
			board: JSON.stringify(app.puzzle.rows.map(row => row.slots.map(slot => slot.possible))),
		}));
		host.document.querySelector("#friends-roster-button").click();
		host.document.querySelector("#friends-leave").click();
		await waitFor(() => bob.document.querySelector("#friends-roster-status").textContent === "Host disconnected",
			"host departure remains visible to the guest");
		assert(!bob.document.querySelector("#friends-roster").hidden &&
		       bob.document.body.classList.contains("multiplayer") &&
		       !bob.document.querySelector("#new-game-button").disabled,
		       "host departure dismissed the roster or disabled New Game");
		bob.document.querySelector("#friends-roster-button").click();
		assert(bob.document.querySelector("#friends-leave").textContent === "End multiplayer",
		       "guest has no explicit End multiplayer action");
		bob.document.querySelector("#friends-leave").click();
		assert(bob.puzzle.actionController === null && bob.document.querySelector("#friends-roster").hidden,
		       "ending multiplayer did not restore solo play");
		for (const [index, app] of [host, bob].entries()) {
			const old = beforeDeparture[index];
			assert(app.puzzle.seed === old.seed && app.puzzle.timerTimeout !== null &&
			       Date.now() - app.puzzle.timerStarted >= old.elapsed && !app.puzzle.scoreEligible &&
			       JSON.stringify(app.puzzle.rows.map(row => row.slots.map(slot => slot.possible))) === old.board,
			       "leaving multiplayer reset the board, timer, or score eligibility");
			assert(!app.document.body.classList.contains("multiplayer"), "solo layout was not restored");
			const slot = app.puzzle.rows[1].slots.find(slot => !slot.single);
			app.puzzle.requestTileAction(slot, slot.value, "place");
			assert(slot.single, "former multiplayer player could not continue solo");
		}
		bob.document.querySelector("#new-game-button").click();
		assert(bob.puzzle.scoreEligible && !bob.puzzle.gameOver,
			"guest New Game still used the disconnected session");
		for (const app of [randomGuest, seedGuest])
			await waitFor(() => app.document.querySelector("#friends-roster-status").textContent === "Host disconnected",
				"extra guest sees host departure");
		randomGuest.document.querySelector("#new-game-button").click();
		assert(randomGuest.document.querySelector("#friends-roster").hidden &&
		       !randomGuest.document.body.classList.contains("multiplayer") && randomGuest.puzzle.scoreEligible,
		       "New Game did not leave the disconnected room");
		seedGuest.puzzle.toggleOptions();
		const seedInput = seedGuest.document.querySelector("#game-seed");
		seedInput.value = "invalid";
		seedGuest.document.querySelector("#start-game-button").click();
		assert(!seedGuest.document.querySelector("#friends-roster").hidden,
		       "invalid seed prematurely left the disconnected room");
		seedInput.value = "10699";
		seedGuest.document.querySelector("#start-game-button").click();
		assert(seedGuest.puzzle.seed === 0x10699 && seedGuest.puzzle.scoreEligible &&
		       seedGuest.document.querySelector("#friends-roster").hidden &&
		       !seedGuest.document.body.classList.contains("multiplayer") && seedGuest.puzzle.options.hidden,
		       "seed start did not leave the disconnected room");
		host.puzzle.newGame(0x10699);
		const soloSlot = host.puzzle.rows[0].slots.find(slot => !slot.single);
		host.puzzle.requestTileAction(soloSlot, soloSlot.value, "place");
		host.puzzle.timerStarted = Date.now() - 45000;
		const soloSeed = host.puzzle.seed;
		host.document.querySelector("#friends-button").click();
		assert(host.puzzle.timerTimeout === null, "solo menu did not pause the timer");
		host.document.querySelector("#friends-room-name").value = room + "-adopt";
		host.document.querySelector("#friends-join-room").click();
		await waitFor(() => host.puzzle.actionController?.role == "host", "adopting solo game");
		assert(host.puzzle.seed === soloSeed && soloSlot.single &&
		       host.puzzle.timerTimeout === null && host.puzzle.paused &&
		       host.puzzle.actionController.clockState().elapsed >= 45000 &&
		       !host.puzzle.actionController.recentActions.size,
		       "hosting through the menu reset the solo game or its timer");
		host.document.querySelector("#friends-menu .modal-close").click();
		assert(host.puzzle.timerTimeout !== null && !host.puzzle.paused,
		       "closing hosting setup did not resume the game");
		host.document.querySelector("#friends-roster-button").click();
		assert(host.puzzle.timerTimeout !== null && !host.puzzle.paused,
		       "reopening the multiplayer dialog paused the game again");
		host.document.querySelector("#friends-leave").click();
		result.textContent = "PASS: lobby, shared New Game controls, player action histories, guest and host departures";
	} catch (error) {
		result.textContent = "FAIL: " + error.stack;
	}
	console.log("ROSTER_TEST_RESULT " + result.textContent);
})();
</script>
