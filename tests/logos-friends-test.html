<!doctype html>
<meta charset="utf-8">
<title>Logos multiplayer browser tests</title>
<style>iframe { width: 30%; height: 650px; }</style>
<pre id="result">Running (serve this page over HTTP)…</pre>
<script>
(async function() {
	const result = document.querySelector("#result");
	const frames = [];
	const room = "browser-test-" + crypto.randomUUID();
	function assert(condition, message) {
		if (!condition) throw new Error(message);
	}
	async function waitFor(test, message) {
		const deadline = Date.now() + 40000;
		while (!test()) {
			if (Date.now() > deadline) throw new Error("Timed out: " + message);
			await new Promise(resolve => setTimeout(resolve, 100));
		}
	}
	async function open(role, name) {
		const frame = document.createElement("iframe");
		frame.src = "../index.html?" + new URLSearchParams({
			"local-role": role, "local-name": name, "local-test": room,
		});
		frames.push(frame);
		const loaded = new Promise(resolve => frame.onload = resolve);
		document.body.append(frame);
		await loaded;
		await waitFor(() => frame.contentDocument.querySelector("#local-test-controls"), "test controls");
		return frame.contentWindow;
	}
	try {
		const host = await open("host", "Helen");
		const alice = await open("guest", "Alice");
		const bob = await open("guest", "Bob");
		const players = app => app.document.querySelector("#friends-roster-players");
		await waitFor(() => [host, alice, bob].every(app => players(app).children.length == 3),
			"three players connected through automatic signaling");
		for (const app of [host, alice, bob]) {
			assert(!app.document.querySelector("#friends-roster").hidden, "roster is hidden");
			assert(Array.from(players(app).querySelectorAll(".friends-roster-name"))
				.map(name => name.textContent).sort().join() == "Alice,Bob,Helen", "names differ");
			assert(players(app).textContent.includes("You"), "own player is not identified");
		}
		alice.document.querySelector("#friends-roster-button").click();
		assert(!alice.document.querySelector("#friends-menu").hidden, "the roster heading did not open the menu");
		alice.document.querySelector("#friends-leave").click();
		assert(alice.document.querySelector("#friends-roster").hidden, "leaving did not hide the roster");
		await waitFor(() => players(host).children.length == 2 && players(bob).children.length == 2,
			"departure propagated to the other guest");
		assert(!players(bob).textContent.includes("Alice"), "departed name remains");
		host.document.querySelector("#friends-roster-button").click();
		host.document.querySelector("#friends-leave").click();
		await waitFor(() => bob.document.querySelector("#friends-roster-status").textContent.includes("Disconnected"),
			"host departure shown to guest");
		assert(players(bob).children.length == 0, "disconnected guest retained a stale roster");
		result.textContent = "PASS: automatic signaling, three-player rosters, clickable heading, guest and host departures";
	} catch (error) {
		result.textContent = "FAIL: " + error.stack;
	}
	console.log("ROSTER_TEST_RESULT " + result.textContent);
})();
</script>
