<!doctype html>
<meta charset="utf-8">
<title>Logos room browser tests</title>
<pre id="result">Running (serve the repository and run wrangler dev on port 8787)…</pre>
<script>
(async function() {
	const result = document.querySelector("#result");
	const room = "browser-room-" + crypto.randomUUID();
	const frames = [];
	function assert(condition, message) {
		if (!condition) throw new Error(message);
	}
	async function waitFor(test, message) {
		console.log("ROOM_TEST waiting: " + message);
		const deadline = Date.now() + 40000;
		while (!test()) {
			if (Date.now() > deadline) throw new Error("Timed out: " + message);
			await new Promise(resolve => setTimeout(resolve, 100));
		}
	}
	async function open(name, join = true, roomName = room) {
		const frame = document.createElement("iframe");
		frame.style = "width:390px;height:844px";
		frame.src = "../index.html" + (roomName === null ? "" : "#room=" + roomName);
		frames.push(frame);
		const loaded = new Promise(resolve => frame.onload = resolve);
		document.body.append(frame);
		await loaded;
		const app = frame.contentWindow, doc = app.document;
		/* Same-machine peers need no external STUN service. */
		const Peer = app.RTCPeerConnection;
		app.RTCPeerConnection = function() { return new Peer({ iceServers: [] }); };
		const Signaling = app.LogosFriends.RoomSignaling;
		app.LogosFriends.RoomSignaling = class extends Signaling {
			constructor(options) { super(options); app.testRoom = this; }
		};
		const Socket = app.WebSocket;
		app.testRoomSockets = [];
		app.WebSocket = class extends Socket {
			constructor(url) { super(url); app.testRoomSockets.push(this); }
		};
		doc.querySelector('meta[name="logos-rooms-endpoint"]').content = "http://127.0.0.1:8787/api/rooms";
		if (roomName === null) doc.querySelector("#friends-button").click();
		assert(!doc.querySelector("#friends-menu").hidden, "room link did not open friends");
		assert(doc.querySelector("#friends-room-name").value == (roomName || ""), "unexpected initial room name");
		doc.querySelector("#friends-player-name").value = name;
		if (join) doc.querySelector("#friends-join-room").click();
		return app;
	}
	try {
		const occupied = await open("Zeno", true, room + "-occupied");
		await waitFor(() => occupied.puzzle.actionController?.role == "host", "occupied room");
		const random = await open("Euclid", false, null);
		random.puzzle.newGame(10699);
		const placed = random.puzzle.rows[0].slots[0];
		random.puzzle.requestTileAction(placed, placed.value, "place");
		let generated = 0;
		random.LogosFriends.generateRoomName = () =>
			room + (++generated == 1 ? "-occupied" : "-random");
		random.document.querySelector("#friends-random-room").click();
		assert(random.document.querySelector("#friends-room-name").value == "",
			"random name shown before joining");
		await waitFor(() => random.puzzle.actionController?.role == "host", "random room");
		assert(generated == 2 && random.testRoom.name == room + "-random", "collision did not retry");
		assert(random.puzzle.seed == 10699 && placed.single, "collision lost the solo game");
		assert(occupied.puzzle.actionController.players.length == 1, "random creation joined occupied room");
		occupied.document.querySelector("#friends-leave").click();
		assert(random.document.querySelector("#friends-room-name-display").textContent == random.testRoom.name,
			"joined random room name not displayed");
		random.document.querySelector("#friends-leave").click();
		assert(random.document.querySelector("#friends-room-name").value == "", "room name not cleared on leave");
		const host = await open("Plato");
		await waitFor(() => host.puzzle.actionController?.role == "host", "first arrival host");
		const guests = await Promise.all([open("Sappho"), open("Socrates")]);
		await waitFor(() => guests.every(app => app.puzzle.actionController?.ready), "two guest handshakes");
		await waitFor(() => host.puzzle.actionController.players.length == 3, "roster");
		assert(guests.every(app => app.puzzle.actionController.role == "guest"), "multiple hosts elected");
		assert(!guests[0].document.querySelector(".friends-name-controls").hidden,
			"joined player cannot edit name");
		const nameField = guests[0].document.querySelector("#friends-player-name");
		nameField.value = "Hypatia";
		nameField.dispatchEvent(new guests[0].Event("change"));
		await waitFor(() => host.puzzle.actionController.players.some(player => player.name == "Hypatia") &&
			guests[1].puzzle.actionController.players.some(player => player.name == "Hypatia"),
			"renamed guest reaches everyone");
		let link;
		Object.defineProperty(host.navigator, "clipboard", {
			configurable: true, value: { async writeText(text) { link = text; } },
		});
		host.document.querySelector("#friends-copy-room").click();
		assert(new URL(link).hash == "#room=" + room, "invitation link has opaque additions");
		guests[0].document.querySelector("#new-game-button").click();
		await waitFor(() => host.puzzle.seed !== undefined &&
			guests.every(app => app.puzzle.seed == host.puzzle.seed), "shared new game");
		guests[0].puzzle.actionController.requestPause(true);
		await waitFor(() => guests.every(app => app.puzzle.paused), "shared pause");
		guests[0].puzzle.actionController.requestPause(false);
		await waitFor(() => guests.every(app => !app.puzzle.paused), "shared resume");
		assert(host.document.querySelector("#friends-renew-room").hidden,
			"open room displays expiration controls");
		assert(host.document.querySelector("#friends-room-name-display").textContent == room &&
			host.document.querySelector(".friends-room-editor").hidden, "open room name is editable");
		/* A signaling interruption must not discard the live WebRTC game. */
		const seed = host.puzzle.seed;
		host.testRoomSockets[0].close();
		await waitFor(() => host.testRoomSockets.length == 2 &&
			host.document.querySelector(".friends-status").textContent.startsWith("You’re hosting."),
			"host signaling reconnect");
		assert(host.puzzle.seed == seed && host.puzzle.actionController.players.length == 3,
			"signaling reconnect changed the shared game");
		/* Closing admission models expiry without waiting fifteen minutes. */
		host.testRoom.send({ type: "leave" });
		await waitFor(() => !host.document.querySelector("#friends-renew-room").hidden,
			"invitation closure");
		assert(host.puzzle.seed == seed && host.puzzle.actionController.players.length == 3,
			"closing invitations interrupted play");
		const other = await open("Aristotle");
		await waitFor(() => other.puzzle.actionController?.role == "host", "another gathering");
		const controller = host.puzzle.actionController;
		host.document.querySelector("#friends-renew-room").click();
		await waitFor(() => host.document.querySelector(".friends-status").textContent.includes("another gathering"),
			"renewal name collision");
		assert(host.puzzle.actionController === controller && host.puzzle.seed == seed,
			"renewal joined the other game");
		host.document.querySelector("#friends-room-name").value = room + "-again";
		host.document.querySelector("#friends-renew-room").click();
		await waitFor(() => host.document.querySelector(".friends-status").textContent.startsWith("You’re hosting."),
			"renewal under a new name");
		other.document.querySelector("#friends-leave").click();
		const late = await open("Hypatia", true, room + "-again");
		await waitFor(() => late.puzzle.actionController?.ready, "late join");
		assert(late.puzzle.seed == host.puzzle.seed, "late guest missed the game");
		host.document.querySelector("#friends-leave").click();
		await waitFor(() => guests.every(app =>
			app.document.querySelector("#friends-roster-status").textContent == "Host disconnected"),
			"host departure");
		await new Promise(resolve => setTimeout(resolve, 300));
		const next = await open("Theseus");
		await waitFor(() => next.puzzle.actionController?.role == "host", "reuse released room");
		next.document.querySelector("#friends-leave").click();
		result.textContent = "PASS: room links, host assignment, simultaneous guests, shared game, reconnect, renewal, collision, late join, room reuse";
	} catch (error) {
		result.textContent = "FAIL: " + error.stack;
	}
	console.log("ROOM_TEST_RESULT " + result.textContent);
})();
</script>
