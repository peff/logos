    <path d="M45 53C34 46 32 58 37 68Q41 74 46 71Q51 75 57 67C63 55 54 47 45 53Z" fill="#e87555" stroke-width="2.5"/>
    <path d="M45 53 47 46" fill="none" stroke-width="2.5"/>
    <path d="M47 49Q49 40 57 44Q56 51 47 49Z" fill="#7cad66" stroke-width="2"/>
    <!-- The pumpkin crosses the lip and spills forward to the left. -->
    <path d="M20 62L21 55 27 54 25 63Z" fill="#7cad66" stroke-width="2"/>
    <path d="M23 63C9 56 5 67 9 77C12 86 19 86 23 83C29 88 39 81 39 73C39 63 32 58 23 63Z" fill="#f59a45" stroke-width="2.5"/>
    <path d="M20 64Q13 73 21 82 M27 64Q34 73 27 83" fill="none" stroke="#bd6838" stroke-width="2"/>
