      <use href="#mouth-rim" fill="none" stroke="#f4c778" stroke-width="6"/>
    </g>
    <!-- Produce overlaps the rim consistently as it spills from the mouth. -->
    <g transform="rotate(24 34 52)" stroke-width="2">
