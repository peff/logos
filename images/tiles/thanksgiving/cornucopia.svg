<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title id="title">Cornucopia A: Left-facing harvest horn</title>
  <defs>
    <ellipse id="mouth-rim" cx="38" cy="54" rx="19" ry="26"/>
  </defs>
  <g stroke="#272334" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 27C58 31 79 45 88 29Q92 22 91 14C103 41 86 72 60 79L39 82Z" fill="#dca15b" stroke="#a9713d"/>
    <path d="M55 31.79Q70 50 61 78.72 M70 36.05Q82 49 77 70.11 M83 34.43Q92 40 89 55.44" fill="none" stroke="#a9713d" stroke-width="2.5"/>
